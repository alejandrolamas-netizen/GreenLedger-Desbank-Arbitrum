name: Arbitrum indexer tests

on:
  pull_request:
    paths:
      - "tools/arb_indexer/**"
      - ".github/workflows/arbitrum-indexer-ci.yml"
  push:
    branches:
      - "feat/arbitrum-sepolia-event-indexer"
    paths:
      - "tools/arb_indexer/**"
      - ".github/workflows/arbitrum-indexer-ci.yml"

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/arb_indexer/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r tools/arb_indexer/requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s tools/arb_indexer/tests -p "test_*.py" -v
      - name: Compile indexer
        run: python -m py_compile tools/arb_indexer/indexer.py
